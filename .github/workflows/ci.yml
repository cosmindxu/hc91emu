# CI for the HC-91 emulator. Runs the firmware-free correctness suite —
# the Z80 instruction exercisers, the unit tests, and the SingleStepTests
# vectors — none of which need a system ROM, so CI never fetches anything
# copyrighted. (The SingleStepTests vectors come from GitHub and are
# cached.) The ROM-dependent integration tests — boot, games, CP/M, disk,
# tape, SDL frontend — run locally via `make test`, where the ROMs live
# (fetched once with tools/get_roms.sh); GitHub's runners can't reach the
# ROM preservation host, and fetching firmware in a public pipeline is
# undesirable regardless.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (whole tree)
        run: make

      - name: Cache SingleStepTests vectors
        uses: actions/cache@v4
        with:
          path: tests/vectors
          key: sst-vectors-${{ hashFiles('tests/get_vectors.sh') }}

      - name: Fetch SingleStepTests vectors
        run: ./tests/get_vectors.sh

      - name: Z80 core — zexdoc + unit tests + SingleStepTests (no firmware)
        run: |
          ./build/ttest
          ./build/ctest
          ./build/dtest
          ./build/zexrun tests/zexdoc.com | tee zexdoc.log
          test "$(grep -c ERROR zexdoc.log)" = 0
          test "$(grep -c OK zexdoc.log)" -ge 60
          ./build/sst tests/vectors/*.json

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan + UBSan
        run: >
          make CFLAGS="-std=c99 -O1 -g -fsanitize=address,undefined
          -fno-sanitize-recover=all -Wall -Wextra"

      - name: Cache SingleStepTests vectors
        uses: actions/cache@v4
        with:
          path: tests/vectors
          key: sst-vectors-${{ hashFiles('tests/get_vectors.sh') }}

      - name: Fetch SingleStepTests vectors
        run: ./tests/get_vectors.sh

      - name: Unit tests + SingleStepTests under sanitizers
        run: |
          ./build/ttest
          ./build/ctest
          ./build/dtest
          ./build/sst tests/vectors/*.json
