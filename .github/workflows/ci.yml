# CI for the HC-91 emulator. Runs the DOWNLOAD-FREE correctness suite:
# everything here is built from the repo and needs no network fetch, so
# CI never pulls anything copyrighted and never depends on a third-party
# host (or gets rate-limited by one). zexdoc (tests/zexdoc.com, committed)
# is the classic Z80 instruction validation; ttest/ctest/dtest cover
# instruction timing, memory contention and the disassembler. Both run
# under ASan/UBSan too. The heavier fetch-based tests — the SingleStepTests
# vectors (tests/get_vectors.sh) and the ROM-dependent integration tests
# (boot, games, CP/M, disk, tape, SDL) — run locally via `make test`,
# where the data already lives.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (whole tree)
        run: make

      - name: Z80 core — zexdoc + unit tests (no downloads, no firmware)
        run: |
          ./build/ttest
          ./build/ctest
          ./build/dtest
          ./build/zexrun tests/zexdoc.com | tee zexdoc.log
          test "$(grep -c ERROR zexdoc.log)" = 0
          test "$(grep -c OK zexdoc.log)" -ge 60

  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with ASan + UBSan
        run: >
          make CFLAGS="-std=c99 -O1 -g -fsanitize=address,undefined
          -fno-sanitize-recover=all -Wall -Wextra"

      - name: zexdoc + unit tests under sanitizers
        run: |
          ./build/ttest
          ./build/ctest
          ./build/dtest
          ./build/zexrun tests/zexdoc.com | tee zexdoc.log
          test "$(grep -c ERROR zexdoc.log)" = 0
          test "$(grep -c OK zexdoc.log)" -ge 60
