# CI for the STELLAR DRIFT game: assemble it and run headless tests against
# the emulator (build, screenshot, OCR gameplay assertions and WAV capture).
name: game

on:
  push:
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pasmo (Z80 assembler)
        run: sudo apt-get update && sudo apt-get install -y pasmo

      - name: Build the emulator
        run: make

      - name: Fetch ROMs (needed to run the emulator)
        run: tools/get_roms.sh

      - name: Build the game (.tap/.tzx + loading screen)
        run: cd game && bash build.sh

      - name: Check artefacts exist and are non-empty
        run: |
          test -s game/build/game.tap
          test -s game/build/game.tzx
          test -s game/build/game.bin

      - name: Title screen shows the game name
        run: |
          ./build/hc91emu --rom roms/hc91.rom --autoload --turbo --kempston \
            --frames 1800 --text game/build/game.tap | tee /tmp/title.txt
          grep -q "STELLAR DRIFT" /tmp/title.txt

      - name: Sprite depack is byte-identical to source
        run: |
          # boot, snapshot RAM, and prove the Z80 LZSS depacker reproduces the
          # sprite bytes exactly at SPRBASE (guards the compression tooling)
          ./build/hc91emu --rom roms/hc91.rom --autoload --turbo \
            --frames 1500 --save-sna /tmp/g.sna game/build/game.tap
          python3 game/tools/check_unpack.py /tmp/g.sna

      - name: Gameplay - boot, start and reach the first zone
        run: |
          ./build/hc91emu --rom roms/hc91.rom --autoload --turbo --kempston \
            --joy "1750-1758:F" --joy "1800-2600:F" \
            --frames 2600 --screenshot /tmp/play.png \
            --save-scr /tmp/play.scr game/build/game.tap
          test -s /tmp/play.png
          ./build/hc91emu --rom roms/hc91.rom --autoload --turbo --kempston \
            --joy "1750-1758:F" --joy "1800-2600:F" --frames 2600 --text \
            game/build/game.tap | tee /tmp/screen.txt
          # the in-game HUD must show the first zone's name
          grep -q "ORION DRIFT" /tmp/screen.txt

      - name: Gameplay regression - long run stays alive and on-HUD
        run: |
          # play ~6000 frames with fire held; the HUD (zone name) must still
          # be present, proving the game did not crash back to the ROM.
          ./build/hc91emu --rom roms/hc91.rom --autoload --turbo --kempston \
            --joy "1750-1758:F" --joy "1800-7000:F" --frames 7000 --text \
            game/build/game.tap | tee /tmp/long.txt
          grep -Eq "DRIFT|VEIL|SAPPHIRE|MAGENTA|EMERALD|VOID|BONUS|GAME OVER" /tmp/long.txt

      - name: Gameplay regression - terrain crash costs lives (game over)
        run: |
          # first FIRE opens the mission briefing, second FIRE launches, then
          # holding UP flies into the cave ceiling repeatedly -> GAME OVER
          ./build/hc91emu --rom roms/hc91.rom --autoload --turbo --kempston \
            --joy "1750-1758:F" --joy "1790-1798:F" --joy "1800-13000:U" \
            --frames 13000 --text game/build/game.tap | tee /tmp/crash.txt
          grep -q "GAME OVER" /tmp/crash.txt
          grep -q "RANK" /tmp/crash.txt   # end-of-run rank on the game-over screen

      - name: 128K - boots and captures AY audio
        run: |
          ./build/hc91emu --machine hc128 --rom roms/hc-128.rom \
            --rom1 roms/hc-128.rom --autoload --kempston \
            --joy "1750-1770:F" --joy "1800-2600:F" --frames 2600 \
            --wav /tmp/ay.wav game/build/game.tap
          test -s /tmp/ay.wav

      - name: Story - mission briefing shows on a new game
        run: |
          # the first FIRE opens the briefing; before launching, it must show
          ./build/hc91emu --rom roms/hc91.rom --autoload --turbo --kempston \
            --joy "1750-1758:F" --frames 1820 --text game/build/game.tap \
            | tee /tmp/brief.txt
          grep -q "MISSION BRIEFING" /tmp/brief.txt

      - name: Story - zone card flavour shows on zone entry
        run: |
          # after launching, the first zone shows its story line under the banner
          ./build/hc91emu --rom roms/hc91.rom --autoload --turbo --kempston \
            --joy "1750-1758:F" --joy "1800-1808:F" --frames 1850 --text \
            game/build/game.tap | tee /tmp/card.txt
          grep -q "WARSHIP" /tmp/card.txt

      - name: Story - victory ending screen (VTEST fast-path build)
        run: |
          # a test-only build (VTEST=1) jumps straight to the ending so the
          # victory screen + state-4 flow are exercised without a full
          # playthrough; VSCORE seeds a final score so the rank path is
          # exercised end to end (9999 -> top grade S, not the C fallback)
          ( cd game && pasmo --equ VTEST=1 --equ VSCORE=9999 src/game.asm \
            /tmp/vtest.bin \
            && python3 tools/mktap.py /tmp/vtest.bin /tmp/vtest.tap 32768 stellar )
          ./build/hc91emu --rom roms/hc91.rom --autoload --turbo --kempston \
            --joy "1750-1758:F" --joy "1850-1858:F" --frames 1980 --text \
            /tmp/vtest.tap | tee /tmp/vic.txt
          grep -q "MISSION COMPLETE" /tmp/vic.txt
          grep -q "ALL ZONES CLEARED" /tmp/vic.txt
          grep -q "09999" /tmp/vic.txt
          grep -q "RANK  S" /tmp/vic.txt

      - name: Mastery - Veteran skill is gated, unlocks after winning
        run: |
          # before winning, cycling skill (key 3) caps at Cadet/Pilot/Ace:
          # two presses from the default Pilot must land on Cadet, not Veteran
          ./build/hc91emu --rom roms/hc91.rom --autoload --turbo \
            --keys "1410:3" --keys "1460:3" --frames 1468 --text \
            game/build/game.tap | tee /tmp/gate.txt
          grep -q "CADET" /tmp/gate.txt
          ! grep -q "VETERAN" /tmp/gate.txt
          # after winning (VTEST build), the title shows the unlock badge and
          # cycling skill now reaches Veteran (two presses Pilot->Ace->Veteran)
          ( cd game && pasmo --equ VTEST=1 --equ VSCORE=0 src/game.asm /tmp/vw.bin \
            && python3 tools/mktap.py /tmp/vw.bin /tmp/vw.tap 32768 stellar )
          ./build/hc91emu --rom roms/hc91.rom --autoload --turbo --kempston \
            --joy "1750-1758:F" --joy "1850-1858:F" --joy "1950-1958:F" \
            --keys "2050:3" --keys "2100:3" --frames 2110 --text /tmp/vw.tap \
            | tee /tmp/vet.txt
          grep -q "VETERAN UNLOCKED" /tmp/vet.txt
          grep -q "VETERAN" /tmp/vet.txt
